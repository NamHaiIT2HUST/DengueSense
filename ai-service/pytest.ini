[pytest]
# `app` không được cài như package (không có setup.py/pyproject) — tests import
# bằng đường dẫn tuyệt đối `from app.data.xxx import ...`. Không có dòng này,
# `pytest` (console script) KHÔNG tự thêm thư mục hiện tại vào sys.path, nên
# `import app` lỗi ModuleNotFoundError. `python -m pytest` thì tự thêm cwd nên
# lỗi này không lộ ra khi chạy local kiểu đó — đã gặp đúng bug này ở CI (Ubuntu,
# workflow gọi thẳng lệnh `pytest`).
