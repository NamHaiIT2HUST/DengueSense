# mypy --strict CHỈ áp cho lớp phục vụ mới (app/serving) — ADR-0007.
# Thư viện nghiên cứu (app/forecast, app/data, experiments) giữ nguyên, không ép kiểu nghiêm ngặt.
# Chạy: mypy   (từ ai-service/; đường dẫn lấy từ `files` bên dưới)
[mypy]
python_version = 3.13
files = app/serving
strict = True
warn_unreachable = True
# `app` là namespace package (không có app/__init__.py)
namespace_packages = True
explicit_package_bases = True
mypy_path = .

[mypy-app.forecast.*]
ignore_errors = True

[mypy-app.data.*]
ignore_errors = True
