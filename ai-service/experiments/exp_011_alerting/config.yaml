experiment:
  id: exp_011_alerting
  description: "Bai toan B (canh bao vuot nguong P75) suy tu du bao hoi quy M4-R2: Poisson tho / Platt / Isotonic / Residual; chon bang Brier LOO tren validation"
  author: nam-hai
data: {path: data/processed/v0.2.0/panel_monthly.parquet, filter: "data_source == 'real'"}
splits:
  validation: {n_origins: 10, cutoff: "2008-12-01", embargo_months: 1}
  outer: {n_origins: 8, embargo_months: 1}
  reporting_delay_months: 1
horizons: [1, 2, 3, 6]
alert: {threshold: "P75 lich su cua chinh tinh cho chinh thang duong lich (<= train_end)"}
methods: [poisson_raw, platt, isotonic, residual, isotonic_online]
selection_rule: "Brier leave-one-origin-out tren validation"
metrics: [PR-AUC, ROC-AUC(tham chieu), Brier, ECE, Recall@P0.8, Precision@R0.8, base_rate]
