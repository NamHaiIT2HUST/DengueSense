experiment:
  id: exp_013_alert_levers
  description: "Don bay cho classifier canh bao (exp_012): A1 dac trung khong gian, A2 model chung moi horizon, A3 trung binh hang voi diem suy tu hoi quy"
  author: nam-hai
data: {path: data/processed/v0.2.0/panel_monthly.parquet, filter: "data_source == 'real'"}
splits:
  validation: {n_origins: 10, cutoff: "2008-12-01", embargo_months: 1}
  outer: {n_origins: 8, embargo_months: 1}
  reporting_delay_months: 1
horizons: [1, 2, 3, 6]
levers: [A0_control_exp012, A1_spatial, A2_pooled_horizons, A3_rank_average_with_regression_score]
acceptance_rule: "validation: PR-AUC gop tang >=5% tuong doi VA ROC-AUC gop khong giam so voi A0; outer chi xac nhan"
metrics: [PR-AUC, ROC-AUC, Recall@P0.8, Precision@R0.8]
seed: 42
