experiment:
  id: exp_008_outbreak_north
  description: "Don bay cho bias bung dich + mien Bac tren phan GBM cua M4-R: Tweedie, trong so mau bung dich, pha Climatology B3; chon theo validation, dinh tuyen theo vung -> M4-R2"
  author: nam-hai
data:
  path: data/processed/v0.2.0/panel_monthly.parquet
  filter: "data_source == 'real'"
splits:
  validation: {n_origins: 10, cutoff: "2008-12-01", embargo_months: 1}
  outer: {n_origins: 8, embargo_months: 1}
  reporting_delay_months: 1
horizons: [1, 2, 3, 6]
levers: [C0_control, C1_tweedie, C2_weighted, C3_blend_B3]
lever_params: {tweedie_variance_power: 1.5, outbreak_weight: 3.0, b3_blend_weight: 0.5}
selection_rule: "toan cuc: gop khong te hon C0 >1% va (bung dich hoac reg_avg giam >=5%); dinh tuyen vung: dung don bay tot nhat neu cai thien >10% tren validation"
metrics: {primary: mase}
seed: 42
