# Sinh mã Go từ hợp đồng công khai (contracts/openapi/public-v1.yaml). KHÔNG sửa tay api.gen.go.
# Chạy:  go generate ./services/gateway/api/
# CI kiểm: generate xong mà `git diff --exit-code` khác 0 thì fail (hợp đồng đổi mà quên sinh lại).
package: api
output: api.gen.go
generate:
  models: true
  gin-server: true
  strict-server: true
