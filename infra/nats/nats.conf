# NATS server cho DengueSense (docs/09 §7, ADR-0003).
server_name: denguesense-nats
port: 4222

# Cổng giám sát (healthz, varz) — chỉ mạng nội bộ compose, KHÔNG publish ra host ở pilot.
http: 8222

jetstream {
  store_dir: "/data"
  # Giới hạn để một sự cố (vòng lặp phát sự kiện) không ăn hết đĩa VM pilot.
  max_file_store: 5GB
  max_memory_store: 256MB
}

# Payload tối đa 1 MB: sự kiện chỉ chứa ID + tóm tắt (docs/09 §7.2), lớn hơn là dấu hiệu sai thiết kế.
max_payload: 1MB
