name: CI - contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/ci-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử để so với nhánh nền

      - name: Lint mọi hợp đồng OpenAPI (redocly, cấu hình ở contracts/redocly.yaml)
        working-directory: contracts
        run: npx --yes @redocly/cli@2 lint

      # Thay đổi phá vỡ tương thích bị chặn (docs/09 §6.10), áp cho TỪNG file hợp đồng. Muốn phá vỡ: thêm trường
      # song song + deprecated, hoặc tăng /v2 — xem contracts/README.md.
      - name: Phát hiện thay đổi phá vỡ so với nhánh nền (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          status=0
          for f in contracts/openapi/*.yaml; do
            BASE="origin/${{ github.base_ref }}"
            if git cat-file -e "${BASE}:${f}" 2>/dev/null; then
              git show "${BASE}:${f}" > /tmp/base.yaml
              echo "== ${f}"
              docker run --rm -v /tmp:/t -v "$PWD:/w" tufin/oasdiff \
                breaking /t/base.yaml "/w/${f}" --fail-on ERR || status=1
            else
              echo "== ${f}: chưa có ở nhánh nền — bỏ qua (file mới)"
            fi
          done
          exit $status
