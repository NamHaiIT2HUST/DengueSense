name: CI - dashboard

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "contracts/openapi/public-v1.yaml"
      - "contracts/errors.md"
      - ".github/workflows/ci-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "contracts/openapi/public-v1.yaml"
      - "contracts/errors.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      # Hợp đồng là nguồn sự thật (docs/09 §6.10): kiểu TypeScript phải khớp hợp đồng hiện hành.
      - name: Kiểu API còn đồng bộ với hợp đồng
        run: |
          npm run api:gen
          git diff --exit-code -- src/shared/api/schema.gen.ts || {
            echo "::error::schema.gen.ts lệch hợp đồng. Chạy 'npm run api:gen' trong dashboard/ rồi commit."
            exit 1
          }

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format (prettier)
        run: npm run format:check

      - name: Luật kiến trúc (dependency-cruiser)
        run: npm run depcruise

      - name: Unit / component test
        run: npm run test:coverage

      # tsc -b (nghiêm ngặt) rồi vite build; build cũng sinh lại routeTree.gen.ts.
      - name: Build
        run: npm run build

      - name: Cây route sinh tự động còn đồng bộ
        run: |
          git diff --exit-code -- src/app/routeTree.gen.ts || {
            echo "::error::routeTree.gen.ts lệch thư mục routes. Chạy 'npm run build' trong dashboard/ rồi commit."
            exit 1
          }

      - name: Ngân sách kích thước bundle
        run: npm run size:check

      - name: Cài trình duyệt cho E2E
        run: npx playwright install --with-deps chromium

      - name: E2E + tiếp cận (Playwright, axe)
        run: npm run test:e2e

      - name: Lưu báo cáo E2E khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7

      - name: Kiểm lỗ hổng phụ thuộc (production)
        run: npm audit --omit=dev --audit-level=high
