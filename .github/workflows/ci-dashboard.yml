name: CI - dashboard

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check package.json exists
        id: check
        run: |
          if [ -f "dashboard/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "dashboard/package.json chưa tồn tại — bỏ qua CI cho tới khi service được scaffold."
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        working-directory: dashboard
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: dashboard
        run: npm run lint

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: dashboard
        run: npm run build
