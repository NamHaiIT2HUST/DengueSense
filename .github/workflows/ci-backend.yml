name: CI - backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "ai-service/app/serving/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - "ai-service/app/serving/**"

permissions:
  contents: read

jobs:
  genai-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cài phụ thuộc GenAI phục vụ kiểm thử
        run: pip install 'fastapi>=0.115,<0.117' 'uvicorn>=0.30,<0.31' 'pydantic>=2.9,<3.0' 'cryptography>=50.0,<51.0' 'httpx>=0.28,<0.29'
      - name: Workflow → GenAI → PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd ai-service
          auth_file="${RUNNER_TEMP}/genai-integration-auth.json"
          python -c 'import base64,json,secrets; from cryptography.hazmat.primitives.serialization import Encoding,PrivateFormat,PublicFormat,NoEncryption; from tests.test_serving.jwt_helpers import Signer; s=Signer(); seed=s.key.private_bytes(Encoding.Raw,PrivateFormat.Raw,NoEncryption()); pub=s.key.public_key().public_bytes(Encoding.Raw,PublicFormat.Raw); print(json.dumps({"key":s.public_b64,"private":base64.b64encode(seed+pub).decode(),"workflow":secrets.token_urlsafe(32),"gateway":secrets.token_urlsafe(32)}))' > "$auth_file"
          export GENAI_JWT_PUBLIC_KEY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["key"])' "$auth_file")"
          export IDENTITY_JWT_PRIVATE_KEY="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["private"])' "$auth_file")"
          export WORKFLOW_INTEGRATION_SECRET="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["workflow"])' "$auth_file")"
          export WORKFLOW_INTEGRATION_GATEWAY_SECRET="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["gateway"])' "$auth_file")"
          echo "::add-mask::${IDENTITY_JWT_PRIVATE_KEY}"
          echo "::add-mask::${WORKFLOW_INTEGRATION_SECRET}"
          echo "::add-mask::${WORKFLOW_INTEGRATION_GATEWAY_SECRET}"
          export IDENTITY_SERVICE_SECRET_SHA256_WORKFLOW="$(python -c 'import hashlib,os; print(hashlib.sha256(os.environ["WORKFLOW_INTEGRATION_SECRET"].encode()).hexdigest())')"
          export IDENTITY_SERVICE_SECRET_SHA256_GATEWAY="$(python -c 'import hashlib,os; print(hashlib.sha256(os.environ["WORKFLOW_INTEGRATION_GATEWAY_SECRET"].encode()).hexdigest())')"
          export PGPASSWORD=integration
          psql -h 127.0.0.1 -U integration -d integration -c 'CREATE DATABASE identity_integration'
          export IDENTITY_DB_URL='postgres://integration:integration@127.0.0.1:5432/identity_integration?sslmode=disable'
          export IDENTITY_LISTEN_ADDR='127.0.0.1:25499'
          export WORKFLOW_INTEGRATION_IDENTITY='http://127.0.0.1:25499'
          export WORKFLOW_INTEGRATION_DB='postgres://integration:integration@127.0.0.1:5432/integration?sslmode=disable'
          export WORKFLOW_INTEGRATION_GENAI='http://127.0.0.1:25498/internal/v1'
          cd ../backend
          go build -o "${RUNNER_TEMP}/integration-identity" ./cmd/identity
          "${RUNNER_TEMP}/integration-identity" migrate
          "${RUNNER_TEMP}/integration-identity" serve &
          identity_pid=$!
          cd ../ai-service
          python -m uvicorn app.serving.genai_api.main:app --host 127.0.0.1 --port 25498 &
          genai_pid=$!
          trap 'kill "$genai_pid" "$identity_pid" 2>/dev/null || true; rm -f "$auth_file"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:25498/healthz >/dev/null && curl --fail --silent http://127.0.0.1:25499/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:25498/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:25499/readyz >/dev/null
          cd ../backend
          go test ./services/workflow/adapters/httpapi -run '^TestIntegrationGenAIAndPostgres$' -count=1 -v
          kill "$genai_pid"
          wait "$genai_pid" || true
          cd ../ai-service
          export GENAI_DEMO_MODE=true
          python -m uvicorn app.serving.genai_api.main:app --host 127.0.0.1 --port 25498 &
          genai_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:25498/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:25498/healthz >/dev/null
          export WORKFLOW_INTEGRATION_DEMO=true
          cd ../backend
          go test ./services/workflow/adapters/httpapi -run '^TestIntegrationGenAIAndPostgres$' -count=1 -v

  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # Hợp đồng là nguồn sự thật (docs/09 §6.10): mã sinh phải khớp hợp đồng hiện hành.
      - name: Mã sinh từ hợp đồng còn đồng bộ
        working-directory: backend
        run: |
          go generate ./...
          git diff --exit-code -- . ':!go.sum' || {
            echo "::error::Mã sinh (api.gen.go) lệch hợp đồng. Chạy 'go generate ./...' trong backend/ rồi commit."
            exit 1
          }

      - name: go.mod / go.sum gọn (go mod tidy)
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Có file chưa gofmt"; exit 1; }

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint (gồm depguard — luật ranh giới service)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test (race)
        working-directory: backend
        run: go test ./... -race -count=1

      - name: govulncheck
        working-directory: backend
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test-build
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, surveillance, workflow, notification]
    steps:
      - uses: actions/checkout@v4

      - name: Build image ${{ matrix.service }}
        run: docker build -f backend/build/Dockerfile --build-arg SERVICE=${{ matrix.service }} --build-arg VERSION="${GITHUB_SHA}" -t denguesense/${{ matrix.service }}:ci backend

      - name: Quét lỗ hổng image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: denguesense/${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # Báo cáo CVE nhưng không chặn merge — sẽ đổi lại "1" trước khi production
