openapi: 3.1.0
info:
  title: DengueSense genai — API nội bộ
  version: 1.0.0-draft.2
  description: |
    Service `genai` (Layer 3, Python/FastAPI): RAG sinh dự thảo văn bản chỉ đạo/báo cáo y tế và bộ kiểm soát Guardrails G1-G6.
servers:
  - url: http://genai:8001
    description: Mạng nội bộ compose
security:
  - serviceToken: []

paths:
  /internal/v1/genai/draft:
    post:
      operationId: generateDraft
      summary: Sinh dự thảo văn bản (B2B hoặc B2G) kèm kiểm tra Guardrails G1-G6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftRequest"
      responses:
        "200":
          description: Trả draft nếu không có guardrail chặn. G6 có thể trả passed=false với blocking=false để yêu cầu rà soát thủ công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDraftResponse"
        "401":
          description: Thiếu hoặc sai token dịch vụ.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Guardrail chặn; không có nội dung dự thảo trong response.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/GuardrailBlockedProblem" }

  /internal/v1/genai/rag/query:
    post:
      operationId: queryRagBenchmark
      summary: Truy hồi đơn vị văn bản phục vụ nghiên cứu benchmark offline (fail-closed)
      description: |
        Endpoint nghiên cứu/benchmark phục vụ đánh giá truy hồi tài liệu offline.
        Fail-closed: Trả về answerable=false và hits rỗng nếu truy vấn nằm ngoài phạm vi hoặc không đủ điểm tin cậy.
        Các trích dẫn (citations) được lấy trực tiếp từ các đơn vị đã đối chiếu nguyên văn trong reviewed-units; không cho phép LLM tự tạo URL hoặc quote.
        Lưu ý: Không dùng cho công điện hành chính B2G do tài liệu chưa có phê duyệt pháp lý/chuyên môn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagQueryRequest"
      responses:
        "200":
          description: Kết quả truy hồi văn bản phục vụ benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagQueryResponse"
        "401":
          description: Thiếu hoặc sai token dịch vụ.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer

  schemas:
    GenerateDraftRequest:
      type: object
      required: [draft_type, slots]
      properties:
        draft_type:
          type: string
          enum: [b2b, b2g]
          description: |
            b2b: Báo cáo chuyên môn y tế / dịch tễ nội bộ.
            b2g: Công điện / văn bản chỉ đạo điều hành gửi lãnh đạo, cơ quan ban ngành.
        case_id:
          type: string
          format: uuid
          description: Hồ sơ workflow liên quan; không thay thế nguồn dữ liệu hoặc provenance đã xác thực trong slots.
        title:
          type: string
          description: Tiêu đề gợi ý (nếu có)
        slots:
          type: object
          description: Workflow là nguồn xác thực duy nhất; dựng các giá trị có sẵn từ snapshot Layer 1/2 và kế hoạch phân bổ. Không nhận dữ liệu do người dùng hoặc LLM tự khai làm bằng chứng. Chỉ run_id và province_ids bắt buộc; các slot còn lại tùy chọn khi nguồn tương ứng chưa có.
          required: [province_ids, run_id]
          properties:
            run_id:
              type: string
              format: uuid
            province_ids:
              type: array
              items:
                type: string
            origin_month:
              type: string
              example: "2010-03"
            cases_predicted_total:
              type: number
            budget_allocated:
              type: number
            beds_allocated:
              type: integer
              minimum: 0
            supplies_allocated:
              type: integer
              minimum: 0
            teams_allocated:
              type: integer
              minimum: 0
            summary_points:
              type: array
              items:
                type: string
            provenance:
              $ref: "#/components/schemas/SlotProvenance"
        extra_instructions:
          type: string
          description: Ghi chú trình bày từ Officer; không được dùng làm bằng chứng dữ liệu, địa danh hoặc căn cứ pháp lý.

    GuardrailCheck:
      type: object
      required: [code, name, passed, detail]
      properties:
        code:
          type: string
          enum: [G1, G2, G3, G4, G5, G6]
          description: |
            G1: Không có số liệu ngoài tập giá trị được xác nhận từ slots Layer 1/2.
            G2: Mọi địa danh khớp danh mục hành chính hợp lệ.
            G3: Mọi trích dẫn tồn tại trong kho, đúng điều khoản và còn hiệu lực.
            G4: Đủ thành phần thể thức bắt buộc theo loại văn bản.
            G5: Không có chẩn đoán cá nhân, chỉ định thuốc/liều dùng, khuyến cáo ngoài phạm vi được duyệt hoặc PII.
            G6: Đánh dấu để cán bộ rà soát khi độ dài ngoài khoảng kỳ vọng; không tự chặn.
        name:
          type: string
        passed:
          type: boolean
        detail:
          type: string
        blocking:
          type: boolean
          default: true
          description: Mặc định true nếu không truyền. false biểu thị cờ rà soát thủ công, không tự chặn draft (dùng cho G6). passed chỉ mô tả kết quả kiểm tra; draft bị chặn khi và chỉ khi có mục passed=false và blocking=true.

    GenerateDraftResponse:
      type: object
      required: [title, content, all_guardrails_passed, guardrails, content_hash, citations]
      properties:
        title:
          type: string
        content:
          type: string
          description: Văn bản dự thảo hoàn chỉnh
        all_guardrails_passed:
          type: boolean
          description: true khi không có mục guardrails nào đồng thời passed=false và blocking=true; false khi tồn tại ít nhất một mục như vậy. Cờ passed=false với blocking=false (như G6) không làm giá trị này false.
        guardrails:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailCheck"
        draft_type:
          type: string
          enum: [b2b, b2g]
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 của UTF-8 content.
        citations:
          type: array
          description: Chỉ chứa nguồn được truy hồi và kiểm tra hiệu lực; không được tạo từ văn bản của LLM.
          items:
            $ref: "#/components/schemas/Citation"
        model_used:
          type: string
          description: Tên model thật sự đã gọi; bỏ trống khi dùng template hoặc không có LLM.

    SlotProvenance:
      type: object
      description: Tham chiếu do workflow ghi nhận từ nguồn Layer 1/2. Mọi thuộc tính tùy chọn; chỉ gửi định danh nguồn mà workflow thực sự có. Không chứa giá trị slot, prompt hoặc payload nội bộ.
      properties:
        model_version: { type: string, description: Phiên bản model của run_id nếu workflow có. }
        data_version: { type: string, description: Phiên bản dữ liệu của run_id nếu workflow có. }
        plan_id: { type: string, format: uuid, description: Kế hoạch phân bổ đã xác nhận nếu có. }
        plan_version: { type: integer, minimum: 1, description: Phiên bản kế hoạch nếu có. }
        plan_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 của snapshot kế hoạch nếu workflow có.
        source_flags:
          type: array
          description: Cờ nguồn/dữ liệu của snapshot nếu workflow có.
          items: { type: string }

    Citation:
      type: object
      required: [document_id, title, issuer, document_version, status, effective_from, effective_to, provision, quote, source_url]
      description: Citation đã xác minh trước khi draft thành công được trả. status=effective biểu thị hiệu lực tại thời điểm sinh; lịch sử giữ nguyên trạng thái tại thời điểm sinh.
      properties:
        document_id: { type: string, description: Định danh ổn định của văn bản trong kho tri thức. }
        title: { type: string }
        issuer: { type: string }
        document_version: { type: string, description: Số/ký hiệu hoặc phiên bản văn bản được truy hồi. }
        status:
          type: string
          const: effective
          description: Chỉ citation còn hiệu lực tại thời điểm sinh mới được trả trong response thành công.
        effective_from: { type: [string, "null"], format: date, description: Ngày bắt đầu hiệu lực theo metadata kho tri thức; null nếu văn bản không công bố ngày. }
        effective_to: { type: [string, "null"], format: date, description: Ngày kết thúc hiệu lực theo metadata kho tri thức; null nếu còn hiệu lực không xác định ngày kết thúc. }
        provision:
          type: string
          description: Điều/Khoản/Mục cụ thể trong tài liệu.
        quote: { type: string, description: Trích đoạn trong đúng điều khoản nêu trên. }
        source_url: { type: string, format: uri, description: URL hoặc URI ổn định để mở văn bản nguồn. }

    Problem:
      type: object
      description: RFC 9457 problem details (docs/09 §6.3).
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Mã lỗi ổn định dạng `<service>.<snake_case>` — danh mục ở contracts/errors.md.
          examples: ["common.validation_error"]
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    GuardrailBlockedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [guardrails]
          properties:
            guardrails:
              type: array
              description: Các kiểm tra đã chạy; ít nhất một mục passed=false và blocking=true. Response không chứa nội dung, title, citations hoặc hash của draft bị chặn.
              items:
                $ref: "#/components/schemas/GuardrailCheck"

    RagQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: Câu hỏi hoặc nội dung cần tra cứu căn cứ
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Số lượng đoạn văn bản tối đa cần truy hồi
        language:
          type: string
          description: Mã ngôn ngữ (vi, en)

    RagHitCitation:
      type: object
      required: [document_id, section_path, quote]
      properties:
        document_id:
          type: string
        section_path:
          type: string
        pdf_pages:
          type: string
        printed_pages:
          type: string
        quote:
          type: string
          description: Đoạn trích dẫn nguyên văn lấy từ văn bản nguồn
        source_url:
          type: string

    RagHitResponse:
      type: object
      required: [unit_id, document_id, score, text, citations]
      properties:
        unit_id:
          type: string
        document_id:
          type: string
        score:
          type: number
        text:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/RagHitCitation"

    RagQueryResponse:
      type: object
      required: [query, answerable, reason, research_notice, hits]
      properties:
        query:
          type: string
        answerable:
          type: boolean
          description: Xác định câu hỏi có thuộc phạm vi căn cứ được phép hay không
        reason:
          type: string
          description: Lý do giải thích phạm vi hoặc kết quả truy hồi
        research_notice:
          type: string
          description: Nhãn cảnh báo phục vụ nghiên cứu benchmark, chưa phê duyệt cho công điện B2G
        hits:
          type: array
          items:
            $ref: "#/components/schemas/RagHitResponse"
