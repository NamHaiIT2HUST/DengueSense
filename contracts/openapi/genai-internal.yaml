openapi: 3.1.0
info:
  title: DengueSense genai — API nội bộ
  version: 1.0.0-draft.2
  description: |
    Service `genai` (Layer 3, Python/FastAPI): RAG sinh dự thảo văn bản chỉ đạo/báo cáo y tế và bộ kiểm soát Guardrails G1-G6.
servers:
  - url: http://genai:8001
    description: Mạng nội bộ compose
security:
  - serviceToken: []

paths:
  /internal/v1/genai/draft:
    post:
      operationId: generateDraft
      summary: Sinh dự thảo văn bản (B2B hoặc B2G) kèm kiểm tra Guardrails G1-G6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftRequest"
      responses:
        "200":
          description: Trả draft nếu không có guardrail chặn. G6 có thể trả passed=false với blocking=false để yêu cầu rà soát thủ công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDraftResponse"
        "401":
          description: Thiếu hoặc sai token dịch vụ.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Guardrail chặn; không có nội dung dự thảo trong response.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/GuardrailBlockedProblem" }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer

  schemas:
    GenerateDraftRequest:
      type: object
      required: [draft_type, slots]
      properties:
        draft_type:
          type: string
          enum: [b2b, b2g]
          description: |
            b2b: Báo cáo chuyên môn y tế / dịch tễ nội bộ.
            b2g: Công điện / văn bản chỉ đạo điều hành gửi lãnh đạo, cơ quan ban ngành.
        case_id:
          type: string
          format: uuid
          description: Hồ sơ workflow liên quan; không thay thế nguồn dữ liệu hoặc provenance đã xác thực trong slots.
        title:
          type: string
          description: Tiêu đề gợi ý (nếu có)
        slots:
          type: object
          description: Giá trị đã xác thực do workflow dựng từ snapshot Layer 1/2; không nhận số liệu do người dùng hoặc LLM tự khai làm bằng chứng.
          required: [province_ids, run_id]
          properties:
            run_id:
              type: string
              format: uuid
            province_ids:
              type: array
              items:
                type: string
            origin_month:
              type: string
              example: "2010-03"
            cases_predicted_total:
              type: number
            budget_allocated:
              type: number
            summary_points:
              type: array
              items:
                type: string
            provenance:
              $ref: "#/components/schemas/SlotProvenance"
        extra_instructions:
          type: string
          description: Ghi chú trình bày từ Officer; không được dùng làm bằng chứng dữ liệu, địa danh hoặc căn cứ pháp lý.

    GuardrailCheck:
      type: object
      required: [code, name, passed, detail]
      properties:
        code:
          type: string
          enum: [G1, G2, G3, G4, G5, G6]
          description: |
            G1: Không có số liệu ngoài tập giá trị được xác nhận từ slots Layer 1/2.
            G2: Mọi địa danh khớp danh mục hành chính hợp lệ.
            G3: Mọi trích dẫn tồn tại trong kho, đúng điều khoản và còn hiệu lực.
            G4: Đủ thành phần thể thức bắt buộc theo loại văn bản.
            G5: Không có chẩn đoán cá nhân, chỉ định thuốc/liều dùng, khuyến cáo ngoài phạm vi được duyệt hoặc PII.
            G6: Đánh dấu để cán bộ rà soát khi độ dài ngoài khoảng kỳ vọng; không tự chặn.
        name:
          type: string
        passed:
          type: boolean
        detail:
          type: string
        blocking:
          type: boolean
          description: Mặc định true nếu không truyền. false biểu thị cờ rà soát thủ công, không tự chặn draft (dùng cho G6).

    GenerateDraftResponse:
      type: object
      required: [title, content, all_guardrails_passed, guardrails]
      properties:
        title:
          type: string
        content:
          type: string
          description: Văn bản dự thảo hoàn chỉnh
        all_guardrails_passed:
          type: boolean
          description: Không có guardrail chặn nào thất bại; có thể còn cờ rà soát không chặn như G6.
        guardrails:
          type: array
          items:
            $ref: "#/components/schemas/GuardrailCheck"
        draft_type:
          type: string
          enum: [b2b, b2g]
        content_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 của UTF-8 content.
        citations:
          type: array
          description: Chỉ chứa nguồn được truy hồi và kiểm tra hiệu lực; không được tạo từ văn bản của LLM.
          items:
            $ref: "#/components/schemas/Citation"
        model_used:
          type: string
          description: Tên model thật sự đã gọi; bỏ trống khi dùng template hoặc không có LLM.

    SlotProvenance:
      type: object
      description: Tham chiếu bất biến về đầu vào Layer 1/2 do workflow xác nhận.
      properties:
        model_version: { type: string }
        data_version: { type: string }
        plan_id: { type: string, format: uuid }
        plan_version: { type: integer, minimum: 1 }
        plan_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_flags:
          type: array
          items: { type: string }

    Citation:
      type: object
      required: [document_id, title, provision, quote]
      properties:
        document_id: { type: string }
        title: { type: string }
        issuer: { type: string }
        document_version: { type: string }
        status:
          type: string
          enum: [effective, expired, replaced, unknown]
        effective_from: { type: [string, "null"], format: date }
        effective_to: { type: [string, "null"], format: date }
        provision:
          type: string
          description: Điều/Khoản/Mục cụ thể trong tài liệu.
        quote: { type: string }
        source_url: { type: string, format: uri }

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    GuardrailBlockedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [guardrails]
          properties:
            guardrails:
              type: array
              description: Các kiểm tra đã chạy; ít nhất một mục passed=false và blocking=true. Nội dung draft không được trả kèm.
              items:
                $ref: "#/components/schemas/GuardrailCheck"
