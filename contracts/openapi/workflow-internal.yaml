openapi: 3.1.0
info:
  title: DengueSense workflow — API nội bộ
  version: 1.0.0-draft.2
  description: |
    Hợp đồng NỘI BỘ (service ↔ service), tiền tố `/internal/v1/workflow`.
    Service `workflow` (Layer 2, Go): Xử lý Cảnh báo (Alert), Hồ sơ (Case), Phân bổ nguồn lực, Dự thảo văn bản (Draft), Phê duyệt (Review - 4 mắt) và Lệnh điều phối (Dispatch Order).
servers:
  - url: http://workflow:8001
    description: Mạng nội bộ compose
security:
  - serviceToken: []

paths:
  /internal/v1/workflow/alerts:
    get:
      operationId: listAlerts
      summary: Danh sách cảnh báo
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, all]
          description: Lọc theo trạng thái
        - name: run_id
          in: query
          schema:
            type: string
            format: uuid
          description: Lọc theo lượt dự báo
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /internal/v1/workflow/alerts/{alert_id}/confirm:
    post:
      operationId: confirmAlert
      summary: Xác nhận cảnh báo
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Xác nhận thành công

  /internal/v1/workflow/cases:
    get:
      operationId: listCases
      summary: Danh sách hồ sơ
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, completed, archived, all]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      summary: Tạo hồ sơ xử lý dịch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Tạo hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /internal/v1/workflow/cases/{case_id}:
    get:
      operationId: getCase
      summary: Lấy chi tiết hồ sơ
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Không tìm thấy hồ sơ

  /internal/v1/workflow/cases/{case_id}/allocation-plans:
    post:
      operationId: createAllocationPlan
      summary: Tạo phương án phân bổ nguồn lực cho hồ sơ
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAllocationPlanRequest"
      responses:
        "201":
          description: Tạo phương án thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationPlan"
        "503":
          description: Dịch vụ tối ưu không khả dụng; không tạo phương án.

  /internal/v1/workflow/cases/{case_id}/allocation-plans/{plan_id}/confirm:
    post:
      operationId: confirmAllocationPlan
      summary: Xác nhận phương án phân bổ nguồn lực cho hồ sơ
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Xác nhận phương án thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationPlan"
        "400":
          description: Không tìm thấy phương án phân bổ
        "404":
          description: Không tìm thấy hồ sơ

  /internal/v1/workflow/cases/{case_id}/drafts:
    post:
      operationId: createDraft
      summary: Tạo dự thảo văn bản cho hồ sơ (B2B hoặc B2G)
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftRequest"
      responses:
        "201":
          description: Tạo dự thảo thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDraft"

  /internal/v1/workflow/cases/{case_id}/drafts/generate:
    post:
      operationId: generateDraftForCase
      summary: Dùng AI sinh dự thảo văn bản (B2B hoặc B2G) cho hồ sơ
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftCaseRequest"
      responses:
        "201":
          description: Sinh dự thảo thành công, lưu cùng generation_evidence gắn với content_hash lúc sinh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDispatchDraft"
        "422":
          description: GenAI chặn dự thảo; workflow không lưu nội dung và chuyển tiếp các kiểm tra thất bại.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/GuardrailBlockedProblem" }

  /internal/v1/workflow/drafts/{draft_id}:
    get:
      operationId: getDraft
      summary: Lấy thông tin dự thảo
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDraft"
    patch:
      operationId: updateDraft
      summary: Cập nhật nội dung dự thảo (tăng version, tính lại content_hash)
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchDraft"

  /internal/v1/workflow/drafts/{draft_id}/reviews:
    post:
      operationId: submitReview
      summary: Phê duyệt / Từ chối / Yêu cầu sửa dự thảo (Áp dụng quy tắc 4 mắt)
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewRequest"
      responses:
        "200":
          description: Phê duyệt thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "400":
          description: Vi phạm quy tắc 4 mắt hoặc trạng thái không hợp lệ

  /internal/v1/workflow/drafts/{draft_id}/dispatch:
    post:
      operationId: dispatchApprovedOrder
      summary: Ban hành lệnh điều phối sau khi dự thảo đã được duyệt
      parameters:
        - name: draft_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchOrderRequest"
      responses:
        "201":
          description: Ban hành lệnh thành công, chuyển sang outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchOrder"
        "400":
          description: Dự thảo chưa được duyệt hoặc content_hash không khớp

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Dùng JWT service-to-service lấy từ identity.

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details (docs/09 §6.3).
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Mã lỗi ổn định dạng `<service>.<snake_case>` — danh mục ở contracts/errors.md.
          examples: ["common.validation_error"]
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Alert:
      type: object
      required: [id, run_id, province_id, created_at, status]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        province_id: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }

    Case:
      type: object
      required: [id, alert_id, title, status, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        alert_id:
          type: string
          format: uuid
          description: ID cảnh báo liên kết chính (giữ để tương thích ngược)
          deprecated: true
        title: { type: string }
        status: { type: string, enum: [open, completed, archived] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            alert_ids:
              type: array
              items: { type: string, format: uuid }
            latest_plan_id:
              type: string
              format: uuid
            latest_draft_id:
              type: string
              format: uuid
            latest_plan:
              $ref: "#/components/schemas/AllocationPlan"

    CreateCaseRequest:
      type: object
      required: [title, created_by]
      properties:
        title: { type: string }
        alert_ids:
          type: array
          items: { type: string, format: uuid }
        created_by: { type: string }

    CreateAllocationPlanRequest:
      type: object
      required: [budget, items]
      properties:
        budget: { type: number, format: double }
        items:
          type: array
          items:
            type: object
            required: [province_id, cases_pred, cost]
            properties:
              province_id: { type: string }
              cases_pred: { type: number, format: double }
              cost: { type: number, format: double }

    AllocationPlan:
      type: object
      required: [id, case_id, budget, total_cost, estimated_cases_prevented, allocations, created_at, status, version]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        budget: { type: number, format: double }
        total_cost: { type: number, format: double }
        estimated_cases_prevented: { type: number, format: double }
        allocations:
          type: array
          items:
            type: object
            required: [province_id, amount, explanation]
            properties:
              province_id: { type: string }
              amount: { type: number, format: double }
              explanation: { type: string }
              beds: { type: integer }
              supplies: { type: integer }
              teams: { type: integer }
              cases_pred: { type: number, format: double }
        status:
          type: string
          enum: [draft, confirmed]
          default: draft
        version:
          type: integer
          minimum: 1
          default: 1
        confirmed_by:
          type: string
        confirmed_at:
          type: string
          format: date-time
        created_at: { type: string, format: date-time }

    DispatchDraft:
      type: object
      required: [id, case_id, version, draft_type, title, content, content_hash, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        version: { type: integer }
        draft_type: { type: string, enum: [b2b, b2g] }
        title: { type: string }
        content: { type: string }
        content_hash: { type: string }
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED]
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        generation_evidence:
          $ref: "#/components/schemas/DraftGenerationEvidence"

    DraftGenerationEvidence:
      type: object
      description: Bằng chứng tối thiểu để review và truy vết, gắn với content_hash lúc AI tạo; giữ nguyên như lịch sử khi cán bộ sửa draft. Không chứa raw slots, prompt hoặc payload truy hồi nội bộ.
      required: [content_hash, citations, guardrails, source_provenance]
      properties:
        content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        source_provenance: { $ref: "#/components/schemas/SlotProvenance" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        guardrails:
          type: array
          items: { $ref: "#/components/schemas/GuardrailCheck" }
        model_used:
          type: string
          description: Tên model thật sự đã gọi; bỏ trống nếu dùng template.

    SlotProvenance:
      type: object
      description: Tham chiếu do workflow ghi nhận từ nguồn Layer 1/2. Mọi thuộc tính tùy chọn; chỉ gửi định danh nguồn mà workflow thực sự có. Không chứa giá trị slot, prompt hoặc payload nội bộ.
      properties:
        model_version: { type: string, description: Phiên bản model của run_id nếu workflow có. }
        data_version: { type: string, description: Phiên bản dữ liệu của run_id nếu workflow có. }
        plan_id: { type: string, format: uuid, description: Kế hoạch phân bổ đã xác nhận nếu có. }
        plan_version: { type: integer, minimum: 1, description: Phiên bản kế hoạch nếu có. }
        plan_hash: { type: string, pattern: "^[a-f0-9]{64}$", description: SHA-256 của snapshot kế hoạch nếu workflow có. }
        source_flags:
          type: array
          description: Cờ nguồn/dữ liệu của snapshot nếu workflow có.
          items: { type: string }

    Citation:
      type: object
      required: [document_id, title, issuer, document_version, status, effective_from, effective_to, provision, quote, source_url]
      description: Citation đã xác minh trước khi draft thành công được trả. status=effective biểu thị hiệu lực tại thời điểm sinh; lịch sử giữ nguyên trạng thái tại thời điểm sinh.
      properties:
        document_id: { type: string, description: Định danh ổn định của văn bản trong kho tri thức. }
        title: { type: string }
        issuer: { type: string }
        document_version: { type: string, description: Số/ký hiệu hoặc phiên bản văn bản được truy hồi. }
        status: { type: string, const: effective, description: Chỉ citation còn hiệu lực tại thời điểm sinh mới được trả trong response thành công. }
        effective_from: { type: [string, "null"], format: date, description: Ngày bắt đầu hiệu lực theo metadata kho tri thức; null nếu văn bản không công bố ngày. }
        effective_to: { type: [string, "null"], format: date, description: Ngày kết thúc hiệu lực theo metadata kho tri thức; null nếu còn hiệu lực không xác định ngày kết thúc. }
        provision: { type: string, description: Điều/Khoản/Mục cụ thể trong tài liệu. }
        quote: { type: string, description: Trích đoạn trong đúng điều khoản nêu trên. }
        source_url: { type: string, format: uri, description: URL hoặc URI ổn định để mở văn bản nguồn. }

    GuardrailCheck:
      type: object
      required: [code, name, passed, detail]
      properties:
        code:
          type: string
          enum: [G1, G2, G3, G4, G5, G6]
          description: |
            G1: Không có số liệu ngoài tập giá trị được xác nhận từ slots Layer 1/2.
            G2: Mọi địa danh khớp danh mục hành chính hợp lệ.
            G3: Mọi trích dẫn tồn tại trong kho, đúng điều khoản và còn hiệu lực.
            G4: Đủ thành phần thể thức bắt buộc theo loại văn bản.
            G5: Không có chẩn đoán cá nhân, chỉ định thuốc/liều dùng, khuyến cáo ngoài phạm vi được duyệt hoặc PII.
            G6: Đánh dấu để cán bộ rà soát khi độ dài ngoài khoảng kỳ vọng; không tự chặn.
        name: { type: string }
        passed: { type: boolean }
        detail: { type: string }
        blocking:
          type: boolean
          default: true
          description: Mặc định true nếu không truyền. false biểu thị cờ rà soát thủ công, không tự chặn draft (dùng cho G6). passed chỉ mô tả kết quả kiểm tra; draft bị chặn khi và chỉ khi có mục passed=false và blocking=true.

    GuardrailBlockedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [guardrails]
          properties:
            guardrails:
              type: array
              description: Các kiểm tra đã chạy; ít nhất một mục passed=false và blocking=true. Response không chứa nội dung, title, citations hoặc hash của draft bị chặn.
              items: { $ref: "#/components/schemas/GuardrailCheck" }

    GeneratedDispatchDraft:
      allOf:
        - $ref: "#/components/schemas/DispatchDraft"
        - type: object
          required: [generation_evidence]
          properties:
            generation_evidence:
              $ref: "#/components/schemas/DraftGenerationEvidence"

    CreateDraftRequest:
      type: object
      required: [draft_type, title, content, created_by]
      properties:
        draft_type: { type: string, enum: [b2b, b2g] }
        title: { type: string }
        content: { type: string }
        created_by: { type: string }

    GenerateDraftCaseRequest:
      type: object
      required: [draft_type]
      properties:
        draft_type:
          type: string
          enum: [b2b, b2g]
        plan_id:
          type: string
          format: uuid
          description: Định danh phương án phân bổ được xác nhận để đưa số liệu kế hoạch vào dự thảo.
        title:
          type: string
        extra_instructions:
          type: string

    UpdateDraftRequest:
      type: object
      required: [content, updated_by]
      properties:
        title: { type: string }
        content: { type: string }
        updated_by: { type: string }

    SubmitReviewRequest:
      type: object
      required: [reviewer_id, action, draft_version]
      properties:
        reviewer_id: { type: string }
        draft_version: { type: integer }
        action:
          type: string
          enum: [approve, reject, request_changes]
        note: { type: string }

    ReviewResult:
      type: object
      required: [id, draft_id, draft_version, reviewer_id, action, reviewed_at, draft_status]
      properties:
        id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        draft_version: { type: integer }
        reviewer_id: { type: string }
        action: { type: string, enum: [approve, reject, request_changes] }
        note: { type: string }
        reviewed_at: { type: string, format: date-time }
        draft_status: { type: string }

    DispatchOrderRequest:
      type: object
      required: [recipient, dispatched_by]
      properties:
        recipient: { type: string }
        dispatched_by: { type: string }

    DispatchOrder:
      type: object
      required: [id, case_id, draft_id, recipient, content, content_hash, status, created_at]
      properties:
        id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        recipient: { type: string }
        content: { type: string }
        content_hash: { type: string }
        status: { type: string, enum: [PENDING, SENDING, SENT, DELIVERY_FAILED] }
        created_at: { type: string, format: date-time }
